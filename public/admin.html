<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — ShrimpBrokers</title><style>
:root{font-family:system-ui,Arial;color-scheme:dark}*{box-sizing:border-box}body{background:#071d23;color:#e8f9f5;margin:0}main{max-width:1150px;margin:auto;padding:30px 18px}h1{color:#65e4c5}a{color:#65e4c5}button{background:#56d7bc;color:#06252a;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}button.secondary{background:#24434c;color:white}input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #476269;background:#14303a;color:white;font:inherit}label{font-size:13px;display:grid;gap:5px}.panel{padding:22px;border-radius:14px;background:#102d36;margin:18px 0}#login{max-width:400px}#login form{display:grid;gap:16px}.toolbar{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:11px}.product{padding:15px;border:1px solid #476269;border-radius:12px;margin:13px 0}.producthead{display:flex;gap:12px;justify-content:space-between;align-items:center}.pill{font-size:12px;color:#a1d6ca}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.product form{display:grid;gap:10px;margin-top:10px}small{color:#a0bab5}#message{min-height:25px;color:#65e4c5}.hide{display:none!important}.photo-manager{background:#0a2229;padding:12px;border-radius:10px;margin-top:14px}.photo-manager b{display:block;margin-bottom:10px}.photo-list{display:flex;gap:12px;flex-wrap:wrap}.photo-entry{display:grid;gap:5px}.photo-entry img{width:104px;height:76px;object-fit:cover;border-radius:7px}.photo-entry button{padding:6px;font-size:12px}.upload-label{margin:12px 0;cursor:pointer}.upload-label input{margin-top:6px}</style></head><body><main><div class="toolbar"><h1>🦐 ShrimpBrokers · Administração</h1><a href="/">Ver loja</a></div><p>Altera o stock e os preços. As alterações aparecem na loja imediatamente quando os clientes voltam a carregar os produtos.</p>
<section id="login" class="panel"><h2>Iniciar sessão</h2><form id="loginForm"><label>Utilizador<input name="username" value="admin" required></label><label>Palavra-passe<input type="password" name="password" required autocomplete="current-password"></label><button>Entrar</button></form></section>
<section id="dashboard" class="hide"><div class="toolbar"><h2>Catálogo e stock</h2><div><button id="newBtn">+ Novo produto</button> <button id="logout" class="secondary">Sair</button></div></div><p id="message" role="status"></p><div id="newForm" class="panel hide"></div><div id="items"></div></section>
</main><script src="/admin.js" defer></script></body></html>
